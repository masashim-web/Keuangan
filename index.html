<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Catatan Keuangan</title>
</head><body>
<header><h1>Catatan Keuangan</h1><button id="rf" aria-label="Muat ulang">⟳</button></header>
<div id="perbar">
  <div class="chips" id="per">
    <button data-p="hari">Hari ini</button><button data-p="minggu">Minggu ini</button>
    <button data-p="bulan" class="on">Bulan ini</button><button data-p="custom">Custom</button>
  </div>
  <div id="cust" class="row" hidden><input type="date" id="cf"><input type="date" id="ct"></div>
</div>
<main>
  <section id="v-home" class="view on"><div id="home"></div></section>
  <section id="v-riwayat" class="view">
    <input id="q" placeholder="Cari kategori atau catatan…">
    <select id="fk"></select>
    <div class="row"><input type="date" id="rf1"><input type="date" id="rf2"></div>
    <div id="list"></div>
  </section>
  <section id="v-grafik" class="view">
    <div class="seg" id="mode"><button data-m="hari" class="on">Harian</button><button data-m="bulan">Bulanan</button></div>
    <div id="charts"></div>
  </section>
  <section id="v-set" class="view">
    <div class="card"><h3>Sambungan ke Google Sheets</h3>
      <label>URL Web App (Apps Script)</label><input id="s-url" placeholder="https://script.google.com/macros/s/…/exec">
      <button class="primary" id="s-save">Simpan &amp; Tes Koneksi</button>
    </div>
  </section>
</main>
<nav>
  <button data-v="home" class="on"><i>🏠</i>Beranda</button>
  <button data-v="riwayat"><i>🧾</i>Riwayat</button>
  <button id="fab" aria-label="Tambah Transaksi">+</button>
  <button data-v="grafik"><i>📊</i>Grafik</button>
  <button data-v="set"><i>⚙️</i>Pengaturan</button>
</nav>
<div id="sheet" hidden><div class="panel">
  <div class="seg" id="jenis"><button data-j="pengeluaran" class="on">Pengeluaran</button><button data-j="pemasukan">Pemasukan</button></div>
  <label>Nominal</label><div class="amt"><span>Rp</span><input id="nom" inputmode="numeric" placeholder="0" autocomplete="off"></div>
  <label>Kategori</label><div class="chips wrap" id="kats"></div>
  <label>Tanggal <b id="hr"></b></label><input type="date" id="tgl">
  <label>Catatan (opsional)</label><input id="cat" maxlength="120" placeholder="Misal: makan siang">
  <div class="err" id="err"></div>
  <button class="primary" id="simpan">Simpan</button>
  <button class="danger" id="hapus" hidden>Hapus</button>
  <button class="ghost" id="tutup">Batal</button>
</div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js?v=6"></script>
</body></html>
